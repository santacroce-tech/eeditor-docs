# Build the catalog from the two repositories and publish it to GitHub Pages: on every push here,
# every morning (so a change merged in eeditor-next or eelisp-rs shows up by the next day), and on
# demand from the Actions tab. Each run also brings content/ — every Markdown document, kept in
# this repository — in step with the sources, and commits it when something changed.
name: Catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      refresh-sample:
        description: Make the sample workspace again (npm run pim:sample — builds the engine, takes a few minutes)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The book's code, run on the real engine: a chapter that no longer works stops the deploy.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eeditor-docs
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eeditor-next
          path: eeditor-next
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eelisp-rs
          path: eelisp-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eelisp-rs
      - name: Build the engine
        working-directory: eelisp-rs
        run: cargo build --release --bin eelisp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the book
        run: python3 eeditor-docs/test_book.py --eeditor eeditor-next
        env:
          EELISP_BIN: ${{ github.workspace }}/eelisp-rs/target/release/eelisp

  build:
    needs: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eeditor-docs
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eeditor-next
          path: eeditor-next
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eelisp-rs
          path: eelisp-rs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The sample workspace is what the app writes into a new folder, dated the day it's made, so
      # it is only made again when asked; otherwise the copy in content/sample-workspace is used.
      - if: inputs.refresh-sample
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: inputs.refresh-sample
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.refresh-sample
        name: Make the sample workspace
        run: |
          (cd eelisp-rs && cargo build --release --bin eelisp)
          (cd eeditor-next && npm ci && npm run pim:sample -- "$RUNNER_TEMP/sample")

      # --regen rebuilds the EELisp book from the engine's source first, so it can't lag behind it
      - name: Build
        run: |
          python3 eeditor-docs/build.py --eeditor eeditor-next --eelisp eelisp-rs --out _site --regen --sync \
            ${{ inputs.refresh-sample && format('--sample {0}/sample', runner.temp) || '' }}

      - name: Keep content/ in step
        working-directory: eeditor-docs
        run: |
          git add -A content
          if git diff --cached --quiet; then echo "content/ unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "content: in step with eeditor-next $(git -C ../eeditor-next rev-parse --short HEAD) and eelisp-rs $(git -C ../eelisp-rs rev-parse --short HEAD)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
